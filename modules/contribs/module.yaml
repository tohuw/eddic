name: contribs
version: 0.3.0
summary: >
  The transaction arc's machinery: contributor overlays applied across
  every surface, hash-pinned attribution and consent in the operation
  log, derivation-graph rights computation, and the sale-build fence
  (eddic bundle) that refuses anything uncleared, all-or-nothing —
  machine-authored and unmarked pages included, since a sale is where
  authorship must be answered honestly. Carries the packaging
  walkthrough that works refusals with the owner page by page, and
  delivery by private repository with buyers added as collaborators.
fragility: durable
walk_away: >
  Overlays, consent records and rights metadata stay readable in the
  files; only the sale-build fence stops running, and it refuses rather
  than ships when unsure.
touches:
  - wiki
  - lint
depends:
  - cli
  - wiki
  - lint
cost_posture:
  free: >
    Entirely local and free: stdlib Python via uv. The fence is a
    build refusal, not a service.
  paid: none
  heuristic: n/a
