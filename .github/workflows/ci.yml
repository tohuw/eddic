name: ci

# Manual-only, on purpose. The gate runs locally on pre-push
# (.githooks/pre-push -> tools/gate.py), so no metered Actions minutes
# are spent on every push or PR. Trigger this by hand when you want the
# one thing a local run cannot give: the same gate on all three
# operating systems — before a release, or after touching anything
# portability-sensitive.
#
# It runs `tools/gate.py`, the same command the hook and a maintainer
# run, so this workflow can never check something different from what a
# contributor was told to check.
on:
  workflow_dispatch:

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Gate
        run: uv run tools/gate.py
